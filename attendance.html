<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management - Employee System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .attendance-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #2575fc;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 10px;
        }

        .date-picker {
            margin-bottom: 20px;
        }

        .date-picker input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .attendance-table th, .attendance-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .attendance-table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }

        .attendance-table tr:hover {
            background-color: #f5f5f5;
        }

        .status-select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
            width: 100%;
        }

        .bulk-actions {
            margin-bottom: 20px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #2575fc;
            color: white;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
            margin-right: 8px;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
            margin-right: 8px;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
            margin-right: 8px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .logout-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="attendance-container">
        <div class="header">
            <h1>Attendance Management</h1>
            <div class="user-info">
                <div class="user-avatar" id="user-avatar">U</div>
                <div>
                    <span id="username">User</span>
                    <button class="btn logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>

        <div class="date-picker">
            <label for="attendance-date">Select Date:</label>
            <input type="date" id="attendance-date" value="">
        </div>

        <div class="bulk-actions">
            <button class="btn btn-success" onclick="markAllPresent()">Mark All Present</button>
            <button class="btn btn-danger" onclick="markAllAbsent()">Mark All Absent</button>
        </div>

        <table class="attendance-table">
            <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="attendance-table-body">
                <!-- Employees will be loaded here -->
            </tbody>
        </table>

        <button class="btn btn-primary" onclick="saveAttendance()">Save Attendance</button>
    </div>

    <script>
        // Check if user is logged in
        document.addEventListener('DOMContentLoaded', function() {
            const user = JSON.parse(localStorage.getItem('user'));
            const token = localStorage.getItem('token');
            
            if (!user || !token) {
                window.location.href = 'login.html';
                return;
            }
            
            // Set user info
            document.getElementById('username').textContent = user.username;
            document.getElementById('user-avatar').textContent = user.username.charAt(0).toUpperCase();
            
            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('attendance-date').value = today;
            
            // Load employees and attendance for today
            loadAttendance(today);
            
            // Add event listener for date change
            document.getElementById('attendance-date').addEventListener('change', function() {
                loadAttendance(this.value);
            });
        });
        
        // Load employees and attendance for a specific date
        async function loadAttendance(date) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/attendance/${date}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load attendance data');
                }
                
                const data = await response.json();
                renderAttendanceTable(data);
            } catch (error) {
                console.error('Error loading attendance:', error);
                alert('Failed to load attendance data. Please try again.');
            }
        }
        
        // Render attendance table
        function renderAttendanceTable(data) {
            const tableBody = document.getElementById('attendance-table-body');
            tableBody.innerHTML = '';
            
            data.forEach(record => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${record.employee_id}</td>
                    <td>${record.name}</td>
                    <td>${record.department}</td>
                    <td>
                        <select class="status-select" data-employee-id="${record.employee_id}">
                            <option value="present" ${record.status === 'present' ? 'selected' : ''}>Present</option>
                            <option value="absent" ${record.status === 'absent' ? 'selected' : ''}>Absent</option>
                            <option value="late" ${record.status === 'late' ? 'selected' : ''}>Late</option>
                            <option value="sick_leave" ${record.status === 'sick_leave' ? 'selected' : ''}>Sick Leave</option>
                            <option value="vacation" ${record.status === 'vacation' ? 'selected' : ''}>Vacation</option>
                        </select>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }
        
        // Mark all employees as present
        function markAllPresent() {
            const statusSelects = document.querySelectorAll('.status-select');
            statusSelects.forEach(select => {
                select.value = 'present';
            });
        }
        
        // Mark all employees as absent
        function markAllAbsent() {
            const statusSelects = document.querySelectorAll('.status-select');
            statusSelects.forEach(select => {
                select.value = 'absent';
            });
        }
        
        // Save attendance
        async function saveAttendance() {
            try {
                const date = document.getElementById('attendance-date').value;
                const statusSelects = document.querySelectorAll('.status-select');
                const attendanceData = [];
                
                statusSelects.forEach(select => {
                    attendanceData.push({
                        employee_id: select.dataset.employeeId,
                        date: date,
                        status: select.value
                    });
                });
                
                const token = localStorage.getItem('token');
                const response = await fetch('/api/attendance/bulk', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ records: attendanceData })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to save attendance');
                }
                
                alert('Attendance saved successfully!');
            } catch (error) {
                console.error('Error saving attendance:', error);
                alert('Failed to save attendance. Please try again.');
            }
        }
        
        // Logout function
        function logout() {
            fetch('/api/auth/logout', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                }
            }).finally(() => {
                localStorage.removeItem('user');
                localStorage.removeItem('token');
                window.location.href = 'login.html';
            });
        }
    </script>
</body>
</html>
