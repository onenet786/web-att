<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Test</h1>
    <div id="results"></div>
    
    <script>
        async function testAPI() {
            const results = document.getElementById('results');
            
            try {
                // Test students API
                const studentsResponse = await fetch('http://localhost:3000/api/students');
                const students = await studentsResponse.json();
                
                results.innerHTML += '<h2>Students API Test:</h2>';
                results.innerHTML += '<pre>' + JSON.stringify(students, null, 2) + '</pre>';
                
                // Test attendance API
                const today = new Date().toISOString().split('T')[0];
                const attendanceResponse = await fetch(`http://localhost:3000/api/attendance/${today}`);
                const attendance = await attendanceResponse.json();
                
                results.innerHTML += '<h2>Attendance API Test:</h2>';
                results.innerHTML += '<pre>' + JSON.stringify(attendance, null, 2) + '</pre>';
                
            } catch (error) {
                results.innerHTML += '<h2>Error:</h2>';
                results.innerHTML += '<pre>' + error.message + '</pre>';
            }
        }
        
        testAPI();
    </script>
</body>
</html>
